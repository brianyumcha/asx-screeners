name: Cash-Secured Put Screener

on:
  # Used to need US market hours (it read the live options chain for an
  # exact strike). Dropped that entirely 2026-10-16 - this now screens pure
  # daily price history (RSI/SMA/Bollinger/realized-vol), so it can run any
  # time. 21:00 UTC = 5pm ET, safely after the 4pm US close so each day's
  # SMA/RSI/etc reflect that full day's final print, landing before Sydney
  # wakes up the next morning.
  schedule:
    - cron: '0 21 * * 1-5'   # weekdays, shortly after US market close
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ⚠ Don't manually trigger this workflow twice in quick succession (or
# alongside another of these workflows while one is still building) - see
# materials_index.yml for the full explanation.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build US cash-secured put screener
        run: python3 "OPTIONS SCREENER.py"

      - name: Commit generated page + streak history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f options-us-csp.html options-us-etf.html seen_tickers_options.json
          git diff --staged --quiet || git commit -m "Rebuild cash-secured put screener"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Build homepage (fresh nav)
        run: python3 build_site_index.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          # This workflow only regenerates options-us-csp.html / options-
          # us-etf.html - --preserve-from-live falls back to whatever's
          # currently live for any page not found locally. Only the
          # gitignored screener pages (pre-breakout/pullback/momentum/
          # higher-high/lower-low/volume-anomaly) actually hit that
          # fallback: every git-tracked page (insider-index.html etc.) is
          # always present after checkout, so local wins and live is never
          # even consulted for those - unlike the old unconditional curl
          # here, which clobbered a same-day insider-index.html nav fix
          # with a stale live copy on 2026-10-14 before that exclusion was
          # added by hand.
          python3 deploy_site.py --preserve-from-live
          # This workflow owns options-us-csp.html / options-us-etf.html -
          # fail loud rather than silently deploying an incomplete site if
          # one didn't get generated.
          for f in index.html options-us-csp.html options-us-etf.html; do
            [ -f "_site/$f" ] || { echo "::error::Expected _site/$f to exist after this run - aborting deploy"; exit 1; }
          done

      - name: Refresh nav on any live-fetched pages
        run: python3 refresh_nav.py _site/*.html

      - name: Check nav consistency across every deployed page
        run: python3 check_nav.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
