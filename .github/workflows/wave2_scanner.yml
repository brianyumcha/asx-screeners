name: Wave 2 Scanner

on:
  workflow_dispatch: {}
  # No schedule yet - this is a first cut under review, not a trusted
  # feature. Manual trigger only until the wave-detection accuracy is
  # confirmed and it's worth running on a recurring cadence.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Wave 2 scanner (fresh price-cache-backed scan)
        run: python3 "WAVE2 SCANNER.py"

      - name: Commit generated page and updated price cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wave2-scanner.html price_cache.parquet
          git diff --staged --quiet || git commit -m "Wave 2 scanner rebuild"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Preserve existing screener pages
        # This workflow only regenerates wave2-scanner.html - without this,
        # deploying _site/ here would wipe the gitignored screener pages
        # (materials/healthcare/energy/tech/real-estate/insider-index.html
        # are git-tracked so checkout already restores those) off the live
        # site. `-f` with `|| true` so a first-ever run before these pages
        # exist doesn't break the build.
        run: |
          curl -sf -o pre-breakout.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html || true
          curl -sf -o pullback.html https://brianyumcha.github.io/asx-screeners/pullback.html || true
          curl -sf -o higher-high.html https://brianyumcha.github.io/asx-screeners/higher-high.html || true

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp site_index.html _site/index.html
          cp materials-index.html _site/materials-index.html
          cp healthcare-index.html _site/healthcare-index.html
          cp energy-index.html _site/energy-index.html
          cp tech-index.html _site/tech-index.html
          cp real-estate-index.html _site/real-estate-index.html
          cp financials-index.html _site/financials-index.html
          cp staples-index.html _site/staples-index.html
          cp discretionary-index.html _site/discretionary-index.html
          cp industrials-index.html _site/industrials-index.html
          cp insider-index.html _site/insider-index.html
          [ -f conviction-stack.html ] && cp conviction-stack.html _site/conviction-stack.html || true
          cp wave2-scanner.html _site/wave2-scanner.html
          cp craig-bullish-map.html _site/craig-bullish-map.html
          [ -f pre-breakout.html ] && cp pre-breakout.html _site/pre-breakout.html || true
          [ -f pullback.html ] && cp pullback.html _site/pullback.html || true
          [ -f higher-high.html ] && cp higher-high.html _site/higher-high.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
