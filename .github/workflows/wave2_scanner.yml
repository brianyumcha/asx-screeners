name: Wave 2 Scanner

on:
  workflow_dispatch: {}
  # No schedule yet - this is a first cut under review, not a trusted
  # feature. Manual trigger only until the wave-detection accuracy is
  # confirmed and it's worth running on a recurring cadence.

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ⚠ Don't manually trigger this workflow twice in quick succession (or
# alongside another of these 4 workflows while this one is still
# building) - see materials_index.yml for the full explanation. This one
# only regenerates wave2-scanner.html, so the collision risk here is
# smaller, but the same failure mode applies.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Wave 2 scanner (fresh price-cache-backed scan)
        run: python3 "WAVE2 SCANNER.py"

      - name: Commit generated page and updated price cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wave2-scanner.html price_cache.parquet
          git diff --staged --quiet || git commit -m "Wave 2 scanner rebuild"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Build homepage (fresh nav)
        run: python3 build_site_index.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          # This workflow only regenerates wave2-scanner.html -
          # --preserve-from-live falls back to whatever's currently live
          # for the gitignored screener pages (pre-breakout/pullback/
          # momentum/higher-high/lower-low/volume-anomaly) it never
          # generates itself, so deploying here doesn't wipe them.
          python3 deploy_site.py --preserve-from-live
          # This workflow owns wave2-scanner.html - fail loud rather than
          # silently deploying an incomplete site if it didn't get generated.
          for f in index.html materials-index.html healthcare-index.html energy-index.html tech-index.html real-estate-index.html financials-index.html staples-index.html discretionary-index.html industrials-index.html utilities-index.html comms-index.html red-folder-news.html sector-rotation.html insider-index.html wave2-scanner.html craig-bullish-map.html timing-the-carts.html; do
            [ -f "_site/$f" ] || { echo "::error::Expected _site/$f to exist after this run - aborting deploy"; exit 1; }
          done

      - name: Check nav consistency across every deployed page
        run: python3 check_nav.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
