name: Materials Index

on:
  schedule:
    # Weekdays, evening Sydney-ish (well after ASX close either way, so DST
    # precision doesn't matter here the way it does for scan.yml's intraday
    # runs) - 08:00 UTC ~= 6pm AEST / 7pm AEDT.
    - cron: '0 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ⚠ Don't manually trigger this workflow twice in quick succession (or
# alongside another of these 4 workflows while this one is still
# building) - `cancel-in-progress: false` only serializes the deploy
# step (GitHub's own "github-pages" environment has its own concurrency
# limit), NOT the build job's git push. Every build here fully
# regenerates every page from fresh data each run, so two overlapping
# runs produce genuinely different content for the same files - a real
# conflict the retry/rebase loop below can't resolve, not just a clean
# rebase. Found 2026-09-17: two manual triggers ~1 minute apart made the
# second run fail outright (safely - no partial/bad deploy, just a
# no-op that needs re-triggering once the first run finishes).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build materials index (fresh name/market-cap/revenue fetch)
        run: python3 build_materials_index.py

      - name: Build healthcare index (fresh name/market-cap/revenue fetch)
        run: python3 build_healthcare_index.py

      - name: Build energy index (fresh name/market-cap/revenue fetch)
        run: python3 build_energy_index.py

      - name: Build tech index (fresh name/market-cap/revenue fetch)
        run: python3 build_tech_index.py

      - name: Build real estate index (fresh name/market-cap/yield fetch)
        run: python3 build_real_estate_index.py

      - name: Build financials index (fresh name/market-cap/yield fetch)
        run: python3 build_financials_index.py

      - name: Build consumer staples index (fresh name/market-cap/yield fetch)
        run: python3 build_staples_index.py

      - name: Build consumer discretionary index (fresh name/market-cap/yield fetch)
        run: python3 build_discretionary_index.py

      - name: Build industrials index (fresh name/market-cap/yield fetch)
        run: python3 build_industrials_index.py

      - name: Build utilities index (fresh name/market-cap/yield fetch)
        run: python3 build_utilities_index.py

      - name: Build communication services index (fresh name/market-cap/yield fetch)
        run: python3 build_comms_index.py

      - name: Build red folder news (economic calendar)
        run: python3 build_red_folder_news.py

      - name: Build sector rotation (reads the already-committed price_cache.parquet, no bulk fetch)
        run: python3 build_sector_rotation.py

      - name: Build earnings calendar (ASX reporting season, scraped from CommSec)
        run: python3 build_earnings_calendar.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f materials-index.html healthcare-index.html energy-index.html tech-index.html real-estate-index.html financials-index.html staples-index.html discretionary-index.html industrials-index.html utilities-index.html comms-index.html red-folder-news.html sector-rotation.html earnings-calendar.html
          git diff --staged --quiet || git commit -m "Daily sector index rebuild"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Preserve existing screener pages
        # This workflow only regenerates the sector-index/red-folder pages -
        # without this, deploying _site/ here would wipe these 4 gitignored
        # screener pages off the live site until scan.yml's next run
        # restored them. `-f` (fail on HTTP error) with `|| true` so a
        # first-ever run before these pages exist doesn't break the build.
        run: |
          curl -sf -o pre-breakout.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html || true
          curl -sf -o pullback.html https://brianyumcha.github.io/asx-screeners/pullback.html || true
          curl -sf -o momentum.html https://brianyumcha.github.io/asx-screeners/momentum.html || true
          curl -sf -o higher-high.html https://brianyumcha.github.io/asx-screeners/higher-high.html || true
          curl -sf -o volume-anomaly.html https://brianyumcha.github.io/asx-screeners/volume-anomaly.html || true

      - name: Build homepage (fresh nav)
        run: python3 build_site_index.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          python3 deploy_site.py
          # This workflow owns these pages - fail loud rather than silently
          # deploying an incomplete site if one didn't get generated.
          for f in index.html materials-index.html healthcare-index.html energy-index.html tech-index.html real-estate-index.html financials-index.html staples-index.html discretionary-index.html industrials-index.html utilities-index.html comms-index.html red-folder-news.html sector-rotation.html earnings-calendar.html insider-index.html craig-bullish-map.html timing-the-carts.html; do
            [ -f "_site/$f" ] || { echo "::error::Expected _site/$f to exist after this run - aborting deploy"; exit 1; }
          done

      - name: Check nav consistency across every deployed page
        run: python3 check_nav.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
