name: ASX Screeners

on:
  schedule:
    # Times are UTC, converted assuming AEST (UTC+10) — during AEDT (UTC+11,
    # roughly Oct-Apr) each fires ~1hr later local time.
    - cron: '30 0 * * 1-5'   # 10:30am AEST — Higher-High screener only
    - cron: '0 3 * * 1-5'    # 1:00pm AEST — Higher-High screener only
    - cron: '30 5 * * 1-5'   # 3:30pm AEST — Higher-High screener only
    - cron: '30 6 * * 1-5'   # 4:30pm AEST — Higher-High screener only
    - cron: '0 7 * * 1-5'    # 5:00pm AEST, after close — full run (OBV + Pullback + HH)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run OBV pre-breakout screener
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1-5'
        run: python3 "OBV SCREENER.py"

      - name: Run pullback (Zag Zone) screener
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1-5'
        run: python3 "PULLBACK SCREENER.py"

      - name: Run Higher-High screener
        run: python3 "HH SCREENER.py"

      - name: Preserve existing OBV/Pullback pages on HH-only intraday runs
        if: github.event_name == 'schedule' && github.event.schedule != '0 7 * * 1-5'
        run: |
          curl -sf -o asx_breakout_results.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html
          curl -sf -o asx_pullback_results.html https://brianyumcha.github.io/asx-screeners/pullback.html

      - name: Commit updated cooldown state
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 * * 1-5'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_tickers.json seen_tickers_pullback.json
          git diff --staged --quiet || git commit -m "Update cooldown state"
          git push

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp "asx_breakout_results.html" _site/pre-breakout.html
          cp "asx_pullback_results.html" _site/pullback.html
          cp "asx_hh_results.html" _site/higher-high.html
          cat > _site/index.html <<'HTMLEOF'
          <!doctype html><html><head><meta charset="utf-8"><title>ASX Screeners</title>
          <style>
            body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0c0f;color:#e8edf2;
                 padding:3rem 2rem;max-width:600px;margin:0 auto;}
            h1{font-size:1.6rem;}
            a{color:#00aaff;display:block;margin:1.2rem 0;font-size:1.15rem;text-decoration:none;
              padding:1rem 1.2rem;background:#141820;border:1px solid #1e2530;border-radius:8px;}
            a:hover{border-color:#00e5a0;}
            .note{color:#5a6478;font-size:.8rem;margin-top:2rem;}
          </style></head>
          <body>
            <h1>ASX Screeners</h1>
            <a href="pre-breakout.html">📈 Pre-Breakout Screener (OBV)</a>
            <a href="pullback.html">↩️ Pullback Screener (Zag Zone)</a>
            <a href="higher-high.html">⬆️ Higher-High Screener</a>
            <div class="note">OBV + Pullback run once on weekday afternoons (AEST, after close). Higher-High also runs intraday at 10:30am/1pm/3:30pm/4:30pm AEST. All via GitHub Actions. Not financial advice.</div>
          </body></html>
          HTMLEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scan
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
