name: ASX Screeners

on:
  schedule:
    # GitHub Actions cron is fixed UTC — it can't shift for daylight saving on
    # its own, so every local time slot below is registered TWICE: once at its
    # AEST (UTC+10) instant, once at its AEDT (UTC+11) instant. Both fire
    # year-round; dst_gate.py checks the real current Australia/Sydney offset
    # at runtime and skips whichever set doesn't match the current season.
    - cron: '30 0 * * 1-5'    # 10:30am AEST — HH only
    - cron: '0 3 * * 1-5'     # 1:00pm AEST — HH only
    - cron: '30 5 * * 1-5'    # 3:30pm AEST == 4:30pm AEDT (same UTC instant) — HH only
    - cron: '30 6 * * 1-5'    # 4:30pm AEST — HH only
    - cron: '0 7 * * 1-5'     # 5:00pm AEST, after close — full run
    - cron: '30 23 * * 0-4'   # 10:30am AEDT (falls on the previous UTC day) — HH only
    - cron: '0 2 * * 1-5'     # 1:00pm AEDT — HH only
    - cron: '30 4 * * 1-5'    # 3:30pm AEDT — HH only
    - cron: '0 6 * * 1-5'     # 5:00pm AEDT, after close — full run
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine DST-aware run mode
        id: gate
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 .github/workflows/dst_gate.py

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run OBV pre-breakout screener
        if: steps.gate.outputs.full_run == 'true'
        run: python3 "OBV SCREENER.py"

      - name: Run pullback (Zag Zone) screener
        if: steps.gate.outputs.full_run == 'true'
        run: python3 "PULLBACK SCREENER.py"

      - name: Run Higher-High screener
        if: steps.gate.outputs.should_run == 'true'
        run: python3 "HH SCREENER.py"

      - name: Preserve existing OBV/Pullback pages on HH-only intraday runs
        if: steps.gate.outputs.should_run == 'true' && steps.gate.outputs.full_run != 'true'
        run: |
          curl -sf -o asx_breakout_results.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html
          curl -sf -o asx_pullback_results.html https://brianyumcha.github.io/asx-screeners/pullback.html

      - name: Commit updated price cache
        # Every successful run (including intraday HH-only ones) refreshes
        # price_cache.parquet - it has to be committed every time too, or
        # an intraday run's fetches are just thrown away when the ephemeral
        # runner is torn down, and the next run starts from the same stale
        # cache instead of building on what was just fetched.
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f price_cache.parquet
          git diff --staged --quiet || git commit -m "Update price cache"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git rebase origin/main
          done

      - name: Commit updated cooldown state
        if: steps.gate.outputs.full_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_tickers.json seen_tickers_pullback.json
          git diff --staged --quiet || git commit -m "Update cooldown state"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git rebase origin/main
          done

      - name: Build Pages site
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p _site
          cp "asx_breakout_results.html" _site/pre-breakout.html
          cp "asx_pullback_results.html" _site/pullback.html
          cp "asx_hh_results.html" _site/higher-high.html
          cat > _site/index.html <<'HTMLEOF'
          <!doctype html><html><head><meta charset="utf-8"><title>ASX Screeners</title>
          <style>
            body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0c0f;color:#e8edf2;
                 padding:3rem 2rem;max-width:600px;margin:0 auto;}
            h1{font-size:1.6rem;}
            a{color:#00aaff;display:block;margin:1.2rem 0;font-size:1.15rem;text-decoration:none;
              padding:1rem 1.2rem;background:#141820;border:1px solid #1e2530;border-radius:8px;}
            a:hover{border-color:#00e5a0;}
            .note{color:#5a6478;font-size:.8rem;margin-top:2rem;}
          </style></head>
          <body>
            <h1>ASX Screeners</h1>
            <a href="pre-breakout.html">📈 Pre-Breakout Screener (OBV)</a>
            <a href="pullback.html">↩️ Pullback Screener (Zag Zone)</a>
            <a href="higher-high.html">⬆️ Higher-High Screener</a>
            <div class="note">OBV + Pullback run once on weekday afternoons (after ASX close). Higher-High also runs intraday at 10:30am/1pm/3:30pm/4:30pm local Sydney time. All via GitHub Actions, DST-adjusted automatically. Not financial advice.</div>
          </body></html>
          HTMLEOF

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.should_run == 'true'
        with:
          path: _site

  deploy:
    needs: scan
    if: needs.scan.outputs.should_run == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
