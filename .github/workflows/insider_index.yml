name: Insider Index

on:
  schedule:
    # Weekly, Monday evening Sydney-ish (same UTC slot as materials_index.yml)
    # - 08:00 UTC ~= 6pm AEST / 7pm AEDT. Director purchases are lumpy and
    # the tracker's own lookback window is 180 days, so day-to-day the
    # dataset barely moves - weekly instead of daily saves ~30-45min of
    # compute and ~3000 Yahoo API calls per run without losing much
    # freshness. Was bundled into materials_index.yml's daily job; split
    # out because its long runtime was holding up that job's own daily
    # deploy too.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# ⚠ Don't manually trigger this workflow twice in quick succession (or
# alongside another of these 4 workflows while this one is still
# building) - see materials_index.yml for the full explanation. This one
# only regenerates insider-index.html, so the collision risk here is
# smaller, but the same failure mode applies.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insider buying tracker (fresh director-purchase scan)
        run: python3 build_insider_index.py

      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f insider-index.html
          git diff --staged --quiet || git commit -m "Weekly insider buying tracker rebuild"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Preserve existing screener pages
        # This workflow only regenerates insider-index.html - without this,
        # deploying _site/ here would wipe the gitignored screener pages
        # (materials/healthcare/energy/tech-index.html are git-tracked so
        # checkout already restores those) off the live site. `-f` with
        # `|| true` so a first-ever run before these pages exist doesn't
        # break the build.
        run: |
          curl -sf -o pre-breakout.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html || true
          curl -sf -o pullback.html https://brianyumcha.github.io/asx-screeners/pullback.html || true
          curl -sf -o momentum.html https://brianyumcha.github.io/asx-screeners/momentum.html || true
          curl -sf -o higher-high.html https://brianyumcha.github.io/asx-screeners/higher-high.html || true
          curl -sf -o volume-anomaly.html https://brianyumcha.github.io/asx-screeners/volume-anomaly.html || true

      - name: Build homepage (fresh nav)
        run: python3 build_site_index.py

      - name: Build Pages site
        run: |
          mkdir -p _site
          python3 deploy_site.py
          # This workflow owns insider-index.html - fail loud rather than
          # silently deploying an incomplete site if it didn't get generated.
          for f in index.html materials-index.html healthcare-index.html energy-index.html tech-index.html real-estate-index.html financials-index.html staples-index.html discretionary-index.html industrials-index.html utilities-index.html comms-index.html red-folder-news.html sector-rotation.html insider-index.html craig-bullish-map.html timing-the-carts.html; do
            [ -f "_site/$f" ] || { echo "::error::Expected _site/$f to exist after this run - aborting deploy"; exit 1; }
          done

      - name: Check nav consistency across every deployed page
        run: python3 check_nav.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
