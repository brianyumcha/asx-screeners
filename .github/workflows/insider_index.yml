name: Insider Index

on:
  schedule:
    # Weekly, Monday evening Sydney-ish (same UTC slot as materials_index.yml)
    # - 08:00 UTC ~= 6pm AEST / 7pm AEDT. Director purchases are lumpy and
    # the tracker's own lookback window is 180 days, so day-to-day the
    # dataset barely moves - weekly instead of daily saves ~30-45min of
    # compute and ~3000 Yahoo API calls per run without losing much
    # freshness. Was bundled into materials_index.yml's daily job; split
    # out because its long runtime was holding up that job's own daily
    # deploy too.
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build insider buying tracker (fresh director-purchase scan)
        run: python3 build_insider_index.py

      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f insider-index.html
          git diff --staged --quiet || git commit -m "Weekly insider buying tracker rebuild"
          for i in 1 2 3; do
            git push && break
            echo "Push rejected (concurrent commit to main) - rebasing and retrying (attempt $i)"
            git fetch origin main
            git stash -u
            git rebase origin/main
            git stash pop || true
          done

      - name: Preserve existing screener pages
        # This workflow only regenerates insider-index.html - without this,
        # deploying _site/ here would wipe the gitignored screener pages
        # (materials/healthcare/energy/tech-index.html are git-tracked so
        # checkout already restores those) off the live site. `-f` with
        # `|| true` so a first-ever run before these pages exist doesn't
        # break the build.
        run: |
          curl -sf -o pre-breakout.html https://brianyumcha.github.io/asx-screeners/pre-breakout.html || true
          curl -sf -o pullback.html https://brianyumcha.github.io/asx-screeners/pullback.html || true
          curl -sf -o momentum.html https://brianyumcha.github.io/asx-screeners/momentum.html || true
          curl -sf -o higher-high.html https://brianyumcha.github.io/asx-screeners/higher-high.html || true

      - name: Build Pages site
        run: |
          mkdir -p _site
          cp site_index.html _site/index.html
          cp materials-index.html _site/materials-index.html
          cp healthcare-index.html _site/healthcare-index.html
          cp energy-index.html _site/energy-index.html
          cp tech-index.html _site/tech-index.html
          cp real-estate-index.html _site/real-estate-index.html
          cp financials-index.html _site/financials-index.html
          cp staples-index.html _site/staples-index.html
          cp discretionary-index.html _site/discretionary-index.html
          cp industrials-index.html _site/industrials-index.html
          cp red-folder-news.html _site/red-folder-news.html
          cp insider-index.html _site/insider-index.html
          [ -f conviction-stack.html ] && cp conviction-stack.html _site/conviction-stack.html || true
          [ -f wave2-scanner.html ] && cp wave2-scanner.html _site/wave2-scanner.html || true
          cp craig-bullish-map.html _site/craig-bullish-map.html
          [ -f pre-breakout.html ] && cp pre-breakout.html _site/pre-breakout.html || true
          [ -f pullback.html ] && cp pullback.html _site/pullback.html || true
          [ -f momentum.html ] && cp momentum.html _site/momentum.html || true
          [ -f higher-high.html ] && cp higher-high.html _site/higher-high.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
